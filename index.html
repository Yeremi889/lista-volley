<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voley App - La Lista</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div id="loginScreen" class="glass-card">
            <h1>🏐 Mejengas 🏐</h1>
            <p>no hay lista maletas jajajajja suave...</p>
            <input type="password" id="passwordInput" placeholder="Contraseña secreta">
            <button id="accessBtn"><span></span> Abrir Lista</button>
        </div>

        <div id="mainScreen" class="glass-card hidden">
            <div class="status-badge" id="listCount">0/12</div>
            <h1>Inician los juegos del hambre</h1>
            <button id="clearListBtn" class="btn-admin hidden">Nueva Lista</button>

            <div class="input-group">
                <input type="text" id="playerName" placeholder="Tu nombre..." maxlength="20">
                <button id="addPlayerBtn" class="btn-add">
                    <span class="btn-text">Anotarme</span>
                    <span id="cooldownTimer" class="hidden">60s</span>
                </button>
            </div>

            <div class="list-section">
                <h2>✅ Titulares ✅</h2>
                <div id="attendingList" class="player-grid"></div>
                <h2>⏳🤣 Bancas 🤣⏳</h2>
                <div id="waitingList" class="player-grid"></div>
            </div>
        </div>
    </div>

    <div id="exitModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>¿Te vas a quitar?</h2>
            <p id="exitModalText">¿Se fresea es?</p>
            <div class="modal-buttons">
                <button id="cancelExitBtn" class="btn-secondary">No, era chistin</button>
                <button id="confirmExitBtn" class="btn-danger">Sí, soy maleta</button>
            </div>
        </div>
    </div>

    <div id="clearListModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 style="color: var(--danger);">Nueva Lista</h2>
            <p>¿Borrar toda la lista para otra mejenga?</p>
            <div class="modal-buttons">
                <button id="cancelClearBtn" class="btn-secondary">Cancelar</button>
                <button id="confirmClearBtn" class="btn-danger">Borrar Todo</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
