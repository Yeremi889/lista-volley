<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voley App - La Lista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="bg-scene">
        <svg class="court-lines" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#eaf0ff" stroke-width="3">
            <rect x="20" y="20" width="560" height="280"></rect>
            <line x1="160" y1="20" x2="160" y2="300" stroke-dasharray="10 10"></line>
            <line x1="440" y1="20" x2="440" y2="300" stroke-dasharray="10 10"></line>
            <line x1="300" y1="0" x2="300" y2="320" stroke-width="5"></line>
            <line x1="250" y1="0" x2="250" y2="55" stroke-width="2"></line>
            <line x1="350" y1="0" x2="350" y2="55" stroke-width="2"></line>
        </svg>
        <div class="bg-blob b1"></div>
        <div class="bg-blob b2"></div>
    </div>

    <div class="container">
        <div id="loginScreen" class="glass-card">
            <h1>🏐 Mejengas 🏐</h1>
            <p>no hay lista maletas jajajajja suave...</p>
            <input type="password" id="passwordInput" placeholder="Contraseña secreta">
            <button id="accessBtn"><span></span> Abrir Lista</button>
        </div>

        <div id="mainScreen" class="glass-card hidden">
            <div class="serve-wrap">
                <span class="v-ball">
                    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="17.5" fill="currentColor" stroke="#0d1730" stroke-width="1.4"></circle>
                        <path d="M20 2.5 C 11 9, 11 31, 20 37.5" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                        <path d="M20 2.5 C 29 9, 29 31, 20 37.5" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                        <path d="M3 17 C 11 12, 29 12, 37 17" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                        <path d="M3 23 C 11 28, 29 28, 37 23" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                    </svg>
                </span>
            </div>
            <div class="status-badge" id="listCount">0/12</div>
            <h1>Inician los juegos del hambre</h1>
            <button id="clearListBtn" class="btn-admin hidden">Nueva Lista</button>

            <div class="input-group">
                <input type="text" id="playerName" placeholder="Tu nombre..." maxlength="20">
                <button id="addPlayerBtn" class="btn-add">
                    <span class="btn-text">Anotarme</span>
                    <span id="cooldownTimer" class="hidden">60s</span>
                </button>
            </div>

            <div class="net-divider">
                <span class="v-ball">
                    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="17.5" fill="currentColor" stroke="#0d1730" stroke-width="1.4"></circle>
                        <path d="M20 2.5 C 11 9, 11 31, 20 37.5" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                        <path d="M20 2.5 C 29 9, 29 31, 20 37.5" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                        <path d="M3 17 C 11 12, 29 12, 37 17" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                        <path d="M3 23 C 11 28, 29 28, 37 23" fill="none" stroke="#0d1730" stroke-width="1.4"></path>
                    </svg>
                </span>
            </div>

            <div class="list-section">
                <div class="section-title-wrap">
                    <h2>✅ Titulares ✅</h2>
                    <button id="varHelpBtn" class="btn-var-help" type="button" aria-label="Historial VAR">?</button>
                </div>
                <div id="attendingList" class="player-grid"></div>
                <h2>⏳🤣 Bancas 🤣⏳</h2>
                <div id="waitingList" class="player-grid"></div>
            </div>
        </div>
    </div>

    <!-- Modal del Historial del VAR -->
    <div id="varModal" class="modal-overlay hidden">
        <div class="modal-content var-modal-content">
            <h2 style="margin-top:0; color: var(--chalk);">📜 VAR 📜</h2>
            <div class="history-section">
                <ul id="historyList" class="history-list"></ul>
            </div>
            <div class="modal-buttons" style="margin-top: 15px;">
                <button id="closeVarBtn" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="exitModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 style="margin-top:0;">¿Te vas a quitar?</h2>
            <p id="exitModalText">¿Se fresea es?</p>
            <div class="modal-buttons">
                <button id="cancelExitBtn" class="btn-secondary">No, era chistin</button>
                <button id="confirmExitBtn" class="btn-danger">Sí, soy maleta</button>
            </div>
        </div>
    </div>

    <div id="clearListModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 style="margin-top:0; color: var(--spike-orange);">Nueva Lista</h2>
            <p>¿Borrar toda la lista para otra mejenga?</p>
            <div class="modal-buttons">
                <button id="cancelClearBtn" class="btn-secondary">Cancelar</button>
                <button id="confirmClearBtn" class="btn-danger">Borrar Todo</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
